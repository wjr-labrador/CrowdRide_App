name: crowdride_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^14.1.2
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/map/
    - assets/buttons/
    - assets/profile_page/
    - assets/settings_page/
    - assets/settings_page/appearance_display/
    - assets/settings_page/privacy/
    - assets/settings_page/offline/
    - assets/settings_page/delete/   
    - assets/settings_page/support/ 
    - assets/create_profile/
    - assets/edit_profile/
    - assets/route_page/
    

    
    